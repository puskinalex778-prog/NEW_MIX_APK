name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Необязательно: свой ключ подписи Клонера (чтобы обновлять приложение без удаления)
      # и свой ключ для клонов. Если секретов нет — шаг ничего не делает.
      - name: Restore signing keys (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CLONER_KEY_BASE64: ${{ secrets.CLONER_KEY_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/own.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/own.jks" >> "$GITHUB_ENV"
            echo "Используется собственный ключ подписи"
          fi
          if [ -n "$CLONER_KEY_BASE64" ]; then
            mkdir -p app/src/main/assets
            echo "$CLONER_KEY_BASE64" | base64 -d > app/src/main/assets/cloner_key.p12
            echo "Используется собственный ключ для клонов"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AppCloner.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppCloner-apk
          path: dist/AppCloner.apk

      - name: GitHub Release (for tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AppCloner.apk
