name: Сборка APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Собрать index.html
        run: python3 build.py

      - name: Установить Capacitor
        run: npm install

      - name: Создать Android-проект
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
          # Игра рассчитана на горизонтальный экран
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ostrova-znaniy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
