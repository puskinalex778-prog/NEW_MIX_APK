name: Собрать APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Пересобрать игру из исходников (game-src → assets/www/index.html)
        run: python3 game-src/build/build.py app/src/main/assets/www/index.html

      - name: Собрать debug-APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Подготовить ключ подписи (если заданы секреты)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks

      - name: Собрать подписанный release-APK (если заданы секреты)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: nu-i-shodil-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
