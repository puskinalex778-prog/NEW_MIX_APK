plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.nuishodil.game'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.nuishodil.game'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '2.0'
    }

    // Подпись релиза — только если в GitHub заданы секреты (см. README). Иначе собирается debug-APK.
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // index.html весит ~2,3 МБ — не сжимаем ресурсы игры повторно
    androidResources { noCompress 'html', 'glb', 'json' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
